- aid: runbuggy:authentication
  name: RunBuggy Authentication API
  description: Single POST /login operation that exchanges credentials for the Bearer
    token every other RunBuggy Shippers API operation requires in its Authorization
    header.
  humanURL: https://docs.runbuggy.com/docs/shipping/b6b6c2d4906e9-authentication
