aid: runbuggy
name: RunBuggy
description: 'RunBuggy is a Phoenix, Arizona based technology company operating an
  open, automotive-focused vehicle transportation marketplace and TMS that connects
  car shippers — dealers, auctions, OEMs, rental and fleet operators — with car haulers
  and transporters. Its products are the RunBuggy Marketplace (transportation-as-a-service
  for finding, moving and tracking a vehicle), RunBuggy HITCH (a cloud transportation
  management system that connects to an existing dealer or auction management system
  and transporter network), RunBuggy One (personal vehicle shipping) and RunBot (a
  generative-AI assistant applied to order resolution and delivery-exception prediction).
  RunBuggy publishes a public Shippers API — Swagger 2.0 definitions for Orders, Vehicle
  Transfer Orders, Gate Passes, Webhooks, Companies and Authentication — at docs.runbuggy.com,
  and operates an OAuth-protected Model Context Protocol server for its data-science
  surface.'
