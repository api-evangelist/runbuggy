apis:
- aid: runbuggy:orders
  name: RunBuggy Orders API
  description: 'The core of the RunBuggy Shippers API. Create, quote, retrieve, patch,
    replace and cancel vehicle transportation Orders; work with the per-vehicle Vehicle
    Transfer Orders each Order fans out into; attach and retrieve Gate Passes; and
    register Webhooks that receive vehicleTransferOrder.updated events. 26 operations
    across three tags — Orders, Vehicle Transfer Orders and Webhooks — described in
    Swagger 2.0.'
  humanURL: https://docs.runbuggy.com/docs/shipping/1b7acf7f4d493-orders
  baseURL: https://ng-staging.runbuggy.com/staging/api
  tags:
  - Orders
  - Vehicle Transfer Orders
  - Webhooks
  - Vehicle Shipping
  properties:
  - type: OpenAPI
    url: openapi/runbuggy-orders.json
  - type: Overlay
    url: overlays/runbuggy-orders-overlay.yaml
  - type: Documentation
    url: https://docs.runbuggy.com/docs/shipping/1b7acf7f4d493-orders
- aid: runbuggy:companies
  name: RunBuggy Companies API
  description: Retrieve the companies that have authorized your company to place Orders
    on their behalf, either as a full list or looked up by username. Used together
    with the Orders API to set the payer on a Vehicle Transfer Order.
  humanURL: https://docs.runbuggy.com/docs/shipping/78a3e6d30650c-companies
  baseURL: https://apps.runbuggy.com/staging-v2/api
  tags:
  - Companies
