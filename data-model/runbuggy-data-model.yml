summary: 'The RunBuggy domain has one spine: an Order is the commercial unit a shipper
  places, and it fans out into one Vehicle Transfer Order per vehicle. Everything else —
  fares, directions, gate passes, inspections, driver telemetry, timeline events — hangs
  off the Vehicle Transfer Order. Company is the polymorphic party entity, reused as
  owner, payer, transporter and preferred transporter. 69 schema definitions in total.'
