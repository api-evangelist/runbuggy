notes:
- Three separate Company schemas exist in the docs project (three distinct model nodes
  named "Company"), which is a modelling smell — the party entity is not defined once.
- Page envelopes are modelled as first-class schemas (PageOrder, PageOrderFull,
  PageVehicleTransferOrder, PageVehicleTransferOrderExpanded, PageWebhook) rather than a
  single generic.
- Gate passes are not a distinct entity; they are Attachments on a Vehicle Transfer Order.
