- code: INVALID_VEHICLE_TRANSFER_ORDER
  http_status: 400
  title: Invalid vehicle transfer order
  detail: A vehicle transfer order in the request is not valid.
  remediation: Check the directions (pickup and dropoff addresses), the vehicle, the
