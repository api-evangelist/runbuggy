  url: https://apps.runbuggy.com/runbuggy/mcp-datascience/mcp
  transport: streamable-http
  http_status: 401
  server_header: uvicorn
  www_authenticate: Bearer error="invalid_token", error_description="Authentication required", resource_metadata="https://apps.runbuggy.com/.well-known/oauth-protected-resource/runbuggy/mcp-datascience"
- environment: staging
  url: https://ng-staging.runbuggy.com/staging/mcp-datascience/mcp
