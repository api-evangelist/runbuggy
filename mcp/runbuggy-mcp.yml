  http_status: 401
  server_header: uvicorn
  www_authenticate: Bearer error="invalid_token", error_description="Authentication required", resource_metadata="https://ng-staging.runbuggy.com/.well-known/oauth-protected-resource/staging/mcp-datascience"
authorization:
  model: OAuth 2.1 authorization code + PKCE, with RFC 7591 dynamic client registration
  metadata_document: well-known/runbuggy-oauth-authorization-server.json
  metadata_url: https://apps.runbuggy.com/.well-known/oauth-authorization-server
  issuer: https://apps.runbuggy.com/runbuggy/mcp-datascience
