  - refresh_token
  code_challenge_methods_supported:
  - S256
  token_endpoint_auth_methods_supported:
  - client_secret_post
  - client_secret_basic
  scopes_supported: null
  scopes_note: The authorization server metadata omits scopes_supported, so an MCP client cannot know
    what to request. See scopes/runbuggy-scopes.yml.
tools: []
tools_note: NOT ENUMERATED. tools/list is auth-gated (401 invalid_token) and RunBuggy publishes no llms.txt,
  no MCP registry entry and no documentation of this server, so there is no second source for the tool
  names. Deriving a candidate tool list from the Shippers OpenAPI would misrepresent a data-science server
  as an orders server — the two surfaces are not the same product. Left empty deliberately.
findings:
- id: oauth-protected-resource-broken
  severity: blocking-for-agents
  detail: The 401 challenge points a client at https://apps.runbuggy.com/.well-known/oauth-protected-resource/runbuggy/mcp-datascience
    for RFC 9728 protected-resource metadata, but that path 302-redirects into the apps.runbuggy.com single-page
    app instead of returning JSON. The staging equivalent returns 404. A conformant MCP client that follows
    WWW-Authenticate cannot complete discovery without hard-coding the authorization server.
- id: undocumented
  severity: discoverability
  detail: The server is not linked from runbuggy.com, docs.runbuggy.com, the RunBot AI page, or any public
    MCP registry. Its existence is only observable by probing /.well-known/oauth-authorization-server.
- id: no-scopes-published
  severity: agent-readiness
  detail: scopes_supported is absent from the authorization server metadata and no scope reference is
    documented.
