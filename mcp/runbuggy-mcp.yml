summary: 'RunBuggy runs a hosted, remote Model Context Protocol server called "mcp-datascience" in both
  production and staging. It was found by probe, not by documentation: nothing on runbuggy.com or docs.runbuggy.com
  references it. The server speaks Streamable HTTP, is served by uvicorn, and is protected by OAuth 2.1
  with dynamic client registration and PKCE. An anonymous tools/list returns 401 invalid_token, so the
  tool surface — names, descriptions and inputSchemas — is not publicly readable and is NOT recorded here.
  No tool list is asserted.'
servers:
