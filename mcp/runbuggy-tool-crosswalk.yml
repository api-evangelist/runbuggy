    files:
    - openapi/runbuggy-orders.json
    - openapi/runbuggy-companies.json
    - openapi/runbuggy-authentication.json
    gated: false
    note: Swagger 2.0, published publicly via Stoplight at docs.runbuggy.com. Declared
      hosts are the STAGING environment (ng-staging.runbuggy.com/staging/api and
      apps.runbuggy.com/staging-v2/api); production hosts are not in the spec.
  graphql:
    endpoint: null
    gated: null
    note: No GraphQL surface found on any RunBuggy host.
  mcp:
    url: https://apps.runbuggy.com/runbuggy/mcp-datascience/mcp
    gated: true
    note: OAuth 2.1 protected. tools/list returns 401 invalid_token, so inputSchemas
      require authenticated introspection.
