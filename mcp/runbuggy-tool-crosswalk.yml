summary: 'RunBuggy has both a REST surface (the public Swagger 2.0 Shippers API) and an
  MCP surface (the mcp-datascience server). They are NOT projections of the same core
  and cannot be bound to each other today: the MCP tool list is auth-gated (401
  invalid_token) and RunBuggy publishes no llms.txt, no MCP registry entry and no
  documentation naming a single tool. This crosswalk therefore records a REST-only
  inventory and an explicitly empty binding set. No tool is guessed by name.'
surfaces:
