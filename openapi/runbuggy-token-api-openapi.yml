openapi: 3.2.0
info:
  title: Authentication Token API
  version: '1.0'
  description: '# [Authentication Guide](https://runbuggy.docs.stoplight.io/guides/authentication-guide)'
  contact:
    name: Runbuggy
    email: support@runbuggy.com
  license:
    name: Copyright © RunBuggy 2020
    url: https://runbuggy.com/terms/
servers:
- url: https://ng-staging.runbuggy.com/staging/api/auth
tags:
- name: Token
paths:
  /login:
    post:
      tags:
      - Token
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login-response'
        '400':
          description: ''
      summary: Retrieve token
      operationId: login
      description: Retrieve Bearer token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login-request'
components:
  schemas:
    login-request:
      type: object
      title: Login Request
      description: Login request
      properties:
        username:
          type: string
          example: admin@mycompany.com
        password:
          type: string
          example: supersecret
      required:
      - username
      - password
    login-response:
      type: object
      title: Login Response
      properties:
        username:
          type: string
          example: admin@mycompany.com
        roles:
          type: array
          example:
          - ROLE_TRANSPORTER
          items:
            type: string
        token_type:
          type: string
          default: Bearer
          example: Bearer
        access_token:
          type: string
          example: 5f410h7qp48naudaonq5toop35rqc391
          description: Used for signing requests.
      required:
      - username
      - roles
      - token_type
      - access_token
x-stoplight:
  docs:
    showModels: false
