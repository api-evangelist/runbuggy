- target: $.paths['/companies/authorized/companies'].get
  description: Note how the result is used downstream.
  update:
    x-consequence: low
    x-agentic-note: 'Read-only. The returned company id becomes `payer.id` on EVERY
      vehicle in a Create Order request — it must be repeated per vehicle, not set once
      on the order.'
- target: $.paths['/companies/authorized/companies/findByUserName'].get
  description: Note the lookup variant.
  update:
