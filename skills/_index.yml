shared_rules:
- Send the Authorization header as "Bearer {token}". The spec declares this as an apiKey header, so
  the caller supplies the `Bearer ` prefix.
- 202 means accepted, not created. Poll the `location` header until status is `created`
  or `error`.
- There is NO idempotency key on any operation. Never blind-retry a write; re-query
  first.
- Pagination is `page`/`size`/`sort` with results in a `content` array.
- Errors are `{code, message, field}`, not RFC 9457.
- The published specs describe staging hosts only.
